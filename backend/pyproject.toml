[tool.vercel]
entrypoint = "api:app"

[project]
name = "personal-website-backend"
version = "1.1.0"
requires-python = ">=3.12"

dependencies = [
    "Flask==3.1.0",
    "flask-cors==5.0.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1"
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.7"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"
